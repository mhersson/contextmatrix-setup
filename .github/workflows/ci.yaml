name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: go test -race
        run: go test -race -count=1 ./...
      - name: integration
        run: go test -tags integration -count=1 ./internal/integration/...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      # Fails only on symbol-level findings (the code calls the vulnerable
      # symbol) that also have an upstream fix. A JSON stream without a config
      # message means the output format changed, so the gate fails closed.
      - name: Run govulncheck (fail only on callable, fixable findings)
        run: |
          set -euo pipefail
          govulncheck -format=json ./... > /tmp/vuln.json 2>&1 || true

          CONFIGS=$(jq -s '[.[] | select(.config != null)] | length' /tmp/vuln.json)
          if [ "${CONFIGS}" -eq 0 ]; then
            echo "::error::govulncheck JSON has no config message; its output format may have changed."
            exit 1
          fi

          FIXABLE=$(jq -s '[.[] | select(.finding != null
                                          and (.finding.fixed_version // "") != ""
                                          and (.finding.trace | any((.function // "") != "")))] | length' /tmp/vuln.json)

          echo "callable + fixable findings: ${FIXABLE}"

          govulncheck ./... || true

          if [ "${FIXABLE}" -gt 0 ]; then
            echo "::error::Callable, fixable vulnerabilities detected. See output above."
            exit 1
          fi

          echo "No callable, fixable vulnerabilities. Remaining findings are uncalled by this code or have no upstream fix."
